<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=yes,viewport-fit=cover"
    />
    <title>المصحف الشريف - تلاوات وترتيل</title>
    <meta name="theme-color" content="#1B7A4B" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/quran.css" />
    <!-- style content moved to assets/css/quran.css; kept here for reference: <style> -->
  </head>
  <body>
    <header class="main-header">
      <div class="logo-area">
        <div class="logo-icon-wrapper"><i class="fa-solid fa-mosque"></i></div>
        <h1>المصحف الشريف</h1>
      </div>
      <div class="header-actions">
        <button
          class="header-btn"
          onclick="openSurahIndex()"
          title="فهرس السور"
        >
          <i class="fa-solid fa-magnifying-glass"></i></button
        ><button
          class="theme-toggle"
          id="themeToggle"
          onclick="toggleTheme()"
          title="الوضع الليلي / النهاري"
        >
          <i class="fa-solid fa-moon"></i></button
        ><button class="header-btn" onclick="toggleLinks()">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </header>
    <div id="overlay" onclick="closeAll()"></div>
    <div id="links-menu">
      <div class="menu-header-area">
        <div class="menu-logo"><i class="fa-solid fa-mosque"></i></div>
        <span class="menu-title">استقامة</span
        ><button class="menu-close-btn" onclick="closeAll()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <a href="index.html" class="link-item"
        ><div class="link-circle"><i class="fa-solid fa-house"></i></div>
        الرئيسية</a
      ><a href="azkar.html" class="link-item"
        ><div class="link-circle">
          <i class="fa-solid fa-hands-praying"></i>
        </div>
        الأذكار</a
      ><a href="quran.html" class="link-item"
        ><div class="link-circle"><i class="fa-solid fa-book-open"></i></div>
        القرآن</a
      ><a href="prayertime.html" class="link-item"
        ><div class="link-circle"><i class="fa-solid fa-mosque"></i></div>
        أوقات الصلاة</a
      ><a href="rosary.html" class="link-item"
        ><div class="link-circle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="currentColor"><circle cx="12" cy="3.9" r="1.1"/><circle cx="14.35" cy="4.75" r="1.1"/><circle cx="16" cy="6.6" r="1.1"/><circle cx="16.65" cy="9" r="1.1"/><circle cx="15.45" cy="11.55" r="1.1"/><circle cx="13.65" cy="13.4" r="1.1"/><circle cx="10.35" cy="13.4" r="1.1"/><circle cx="8.55" cy="11.55" r="1.1"/><circle cx="7.35" cy="9" r="1.1"/><circle cx="8" cy="6.6" r="1.1"/><circle cx="9.65" cy="4.75" r="1.1"/><rect x="10.85" y="13.9" width="2.3" height="1.5" rx="0.6"/></g><g stroke="currentColor" stroke-width="1.15" stroke-linecap="round"><path d="M11.1 15.4V19.7"/><path d="M12.25 15.4V20.7"/><path d="M13.4 15.4V19.7"/></g></svg></div>
        التسبيح</a
      ><a href="qipla-direction.html" class="link-item"
        ><div class="link-circle">
          <i class="fa-solid fa-location-arrow"></i>
        </div>
        اتجاه القبلة</a
      ><a href="about.html" class="link-item"
        ><div class="link-circle"><i class="fa-solid fa-circle-info"></i></div>
        حول التطبيق</a
      >
    </div>
    <div class="container">
      <div class="reciter-bar" id="reciterBar">
        <div class="loading-indicator" id="loadingIndicator">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span id="loadingPercent">0%</span>
          <span class="loading-text">جارٍ التحميل...</span>
          <button type="button" class="loading-cancel" id="loadingCancel" onclick="cancelLoading()" aria-label="إلغاء التحميل"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">
          <i class="fa-solid fa-play"></i>
        </button>
        <div class="reciter-text-col">
          <div class="audio-info">
            <div class="audio-surah-name" id="audioSurahName"></div>
            <div class="audio-ayah-info" id="audioAyahInfo"></div>
          </div>
          <div class="reciter-bar-info">
            <span class="reciter-bar-name" id="reciterBarName"
              >ماهر المعيقلي</span
            >
          </div>
        </div>
      </div>
      <div class="reciter-select-wrapper custom-reciter-wrapper">
        <button
          class="reciter-modal-close"
          id="reciterModalClose"
          title="إغلاق"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
        <input
          type="text"
          id="reciterSearchInput"
          class="reciter-search-box"
          placeholder="ابحث عن قارئ..."
          autocomplete="off"
        />
        <div id="reciterOptionsList" class="reciter-options-list"></div>
        <select id="reciterSelect" style="display: none"></select>
      </div>
    </div>
    <div class="container" style="padding-top: 0">
      <div class="page-navigation" id="quranPageNav">
        <button
          class="nav-arrow"
          id="prevPageBtn"
          onclick="changeQuranPage(-1)"
          title="الصفحة السابقة"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="page-slider-wrap">
          <div class="page-slider-track">
            <div class="page-slider-fill" id="pageSliderFill"></div>
            <input
              type="range"
              id="pageRangeSlider"
              min="1"
              max="604"
              value="1"
              aria-label="انتقل إلى صفحة"
            />
          </div>
          <span
            class="page-indicator"
            id="quranPageIndicator"
            style="display: none"
            >صفحة 1</span
          >
          <div class="page-slider-tooltip" id="pageSliderTooltip">
            <span class="tooltip-page-num" id="tooltipPageNum">صفحة 1</span
            ><span class="tooltip-surah-name" id="tooltipSurahName"
              >سورة الفاتحة</span
            >
          </div>
        </div>
        <button
          class="nav-arrow"
          id="nextPageBtn"
          onclick="changeQuranPage(1)"
          title="الصفحة التالية"
        >
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      </div>
      <div
        id="offlineNotice"
        style="
          display: none;
          background: #fff3cd;
          color: #856404;
          padding: 12px 20px;
          border-radius: 12px;
          margin-bottom: 16px;
          text-align: center;
          font-size: 0.9rem;
          border: 1px solid #ffeeba;
        "
      >
        <i class="fa-solid fa-wifi-slash"></i> أنت غير متصل بالإنترنت. يتم عرض
        النص المحمّل مسبقاً.
      </div>
      <div id="verses">جاري التحميل...</div>
      <button id="loadMore"></button>
    </div>
      <button
        class="page-nav-side next"
        id="nextPageSideBtn"
        onclick="changeQuranPage(1)"
        title="الصفحة التالية"
        aria-label="الصفحة التالية"
      >
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button
        class="page-nav-side prev"
        id="prevPageSideBtn"
        onclick="changeQuranPage(-1)"
        title="الصفحة السابقة"
        aria-label="الصفحة السابقة"
      >
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    <audio id="audioPlayer" preload="auto"></audio>
    <button
      id="navModeToggle"
      class="mode-toggle-fab"
      title="تبديل وضع العرض"
      aria-label="تبديل وضع العرض بين التمرير والصفحة الواحدة"
    >
      <i class="fa-solid fa-list"></i>
    </button>
    <div id="navModeTooltip" class="mode-toggle-tip">وضع التمرير</div>
    <div id="index-backdrop" onclick="closeSurahIndex()"></div>
    <div id="surah-index" class="index-overlay" aria-hidden="true"></div>
    <div id="contextMenu" class="context-menu">
      <div class="menu-item" id="ctxPlay" onclick="playFromAyah()">
        <i class="fa-solid fa-headphones"></i> استماع من هذه الآية
      </div>
      <div class="menu-item" id="ctxGreen" onclick="toggleGreenMarker()">
        <i class="fa-solid fa-highlighter"></i> شريط أخضر
      </div>
      <div class="menu-item" id="ctxRed" onclick="toggleRedMarker()">
        <i class="fa-solid fa-highlighter"></i> شريط أحمر
      </div>
      <div class="menu-item" id="ctxCopy" onclick="copyAyahText()">
        <i class="fa-solid fa-copy"></i> نسخ الآية
      </div>
      <div class="menu-item" id="ctxTafsir" onclick="openTafsir()">
        <i class="fa-solid fa-book"></i> التفسير
      </div>
      <div class="menu-item" id="ctxShare" onclick="shareAyah()">
        <i class="fa-solid fa-share-alt"></i> مشاركة
      </div>
    </div>
    <script src="assets/js/quran.js"></script>
    <script>
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
    </script>
  </body>
</html>
