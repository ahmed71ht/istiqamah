<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover"
    />
    <title>استقامة - اتجاه القبلة</title>
    <meta name="theme-color" content="#1B7A4B" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />

    <style>
      /* منع تحديد النصوص */
      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;

        /* منع قائمة الضغط المطول على iPhone وSafari */
        -webkit-touch-callout: none;

        /* إزالة تمييز اللمس على أندرويد وChrome */
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      #header-title {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-primary);
      }

      #links-menu a[href="qipla-direction.html"] {
        background: var(--primary-soft);
        border-right: 3px solid var(--primary);
        color: var(--primary-dark);
        font-weight: 700;
      }
      #links-menu a[href="qipla-direction.html"] .link-circle {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .loading-wrapper {
        background: rgba(27, 122, 75, 0.08);
        backdrop-filter: blur(4px);
        border-radius: 28px;
        margin: 20px 0;
        padding: 35px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        border: 1px dashed var(--primary-green);
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #e0eadd;
        border-top: 5px solid var(--primary-green);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .loading-text {
        font-size: 20px;
        font-weight: 500;
        color: var(--dark-green);
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .loading-text i {
        font-size: 24px;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0% {
          opacity: 0.4;
        }
        100% {
          opacity: 1;
        }
      }

      .location-box {
        text-align: center;
        background: var(--bg-card);
        padding: 30px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.3s;
        border: 1px solid var(--glass-border);
        margin-bottom: 20px;
        color: var(--text-main) !important;
      }
      .location-box:hover {
        transform: translateY(-5px);
        border-color: var(--primary-green);
        box-shadow: 0 10px 20px rgba(27, 122, 75, 0.1);
      }

      button {
        background: var(--primary);
        border: none;
        color: white;
        font-family: inherit;
        font-size: 1rem;
        padding: 10px 24px;
        border-radius: 60px;
        cursor: pointer;
        font-weight: 500;
        transition: 0.2s;
      }
      button:active {
        transform: scale(0.96);
        background: var(--dark-green);
      }
      .hidden {
        display: none !important;
      }

      .qibla-card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 56px;
        padding: 24px 20px 32px;
        margin: 0 auto;
        box-shadow: 0 20px 35px rgba(0, 0, 0, 0.08);
        text-align: center;
        border: 1px solid #ffffffaa;
      }

      .compass-wrapper {
        position: relative;
        width: 280px;
        height: 280px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        box-shadow:
          0 12px 28px rgba(0, 0, 0, 0.1),
          inset 0 1px 2px rgba(255, 255, 255, 0.9);
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: block;
      }

      .compass-center-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #f9f3df;
        z-index: 5;
        pointer-events: none;
      }

      .degree-badge {
        margin-top: 28px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        padding: 12px 20px;
        border-radius: 60px;
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        font-size: 1.2rem;
        font-weight: 500;
        color: var(--dark-green);
      }
      .degree-badge span {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--primary-green);
      }

      .status-message {
        background: var(--bg-card-hover);
        border-radius: 50px;
        padding: 12px 18px;
        margin-top: 24px;
        font-size: 0.95rem;
        color: #b45f06;
        border-right: 4px solid #f9a825;
        transition: 0.2s;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .status-message.on-target {
        background: var(--primary-soft);
        color: var(--dark-green);
        border-right-color: var(--primary-green);
      }

      .hint {
        margin-top: 22px;
        font-size: 0.7rem;
        color: #7a8a6e;
        background: var(--glass-bg);
        backdrop-filter: blur(4px);
        padding: 8px 16px;
        border-radius: 40px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      #links-menu a[href="qipla-direction.html"] {
        background: var(--primary-soft);
        border-right: 3px solid var(--primary);
        color: var(--primary-dark);
        font-weight: 700;
      }
      #links-menu a[href="qipla-direction.html"] .link-circle {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      [data-theme="dark"] .location-box {
        background: var(--bg-card);
        border-color: var(--glass-border);
      }
      [data-theme="dark"] .qibla-card {
        background: var(--bg-card);
        border-color: var(--glass-border);
      }
      [data-theme="dark"] .degree-badge {
        background: rgba(27, 122, 75, 0.15);
        color: var(--primary-light);
      }
      [data-theme="dark"] .status-message {
        background: rgba(27, 122, 75, 0.08);
        color: var(--text-secondary);
        border-color: var(--glass-border);
      }
      [data-theme="dark"] .hint {
        color: var(--text-muted);
      }

      @media (max-width: 480px) {
        .compass-wrapper {
          width: 220px;
          height: 220px;
        }
        canvas {
          width: 220px;
          height: 220px;
        }
        .qibla-card {
          padding: 16px 14px 22px;
          border-radius: 36px;
        }
        .degree-badge {
          margin-top: 18px;
          padding: 10px 16px;
          font-size: 1rem;
        }
        .degree-badge span {
          font-size: 1.8rem;
        }
        .status-message {
          padding: 10px 14px;
          margin-top: 14px;
          font-size: 0.85rem;
          min-height: 40px;
          border-radius: 40px;
        }
        .hint {
          margin-top: 14px;
          padding: 6px 12px;
          font-size: 0.65rem;
        }
      }
    </style>
      <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f1ea;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #page-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid rgba(201, 160, 61, 0.12);
        border-top-color: #1b7a4b;
        border-right-color: #c9a03d;
        animation: loaderSpin 0.85s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 30px rgba(27, 122, 75, 0.06);
      }
      @keyframes loaderSpin {
        to { transform: rotate(360deg); }
      }
          [data-theme="dark"] #page-loader { background: #0e2017; }
      </style></head>

    <header class="main-header">
      <div class="logo-area">
        <div class="logo-icon-wrapper">

      </div>

    <div class="container">
      <div class="section-title">
        <h2 id="header-title">اتجاه القبلة</h2>
      </div>

      <div id="loadingIndicator" style="display: none">
        <div class="loading-wrapper">
          <div class="loading-spinner"></div>
          <div class="loading-text">
            <i class="fa-solid fa-circle-notch"></i>
            <span>جار التحميل ...</span>
          </div>
          <p style="color: #4b6b3e; font-size: 14px">
            يتم تجهيز البوصلة وتحديد الموقع
          </p>
        </div>
      </div>

      <div
        id="offlineNotice"
        style="
          display: none;
          background: #fff3cd;
          color: #856404;
          padding: 10px 16px;
          border-radius: 12px;
          margin-bottom: 12px;
          text-align: center;
          font-size: 0.85rem;
          border: 1px solid #ffeeba;
        "
      ></div>

      <div id="locationBox" class="location-box" onclick="requestLocation()">
        <i
          class="fa-solid fa-location-dot fa-2x"
          style="margin-bottom: 8px; display: block"
        ></i>
        <h3>اضغط لتحديد موقعك فوراً</h3>
        <p style="margin-top: 6px; font-size: 14px; color: #6c7a6e">
          سنحسب اتجاه القبلة بدقة بعد التحديد
        </p>
      </div>

      <div id="qiblaUI" class="hidden">
        <div class="qibla-card">
          <div class="compass-wrapper">
            <canvas id="qiblaCanvas" width="280" height="280"></canvas>
            <i class="fa-solid fa-kaaba compass-center-icon"></i>
          </div>
          <div class="degree-badge">
            القبلة بزاوية
            <span id="qiblaDegrees">--</span>°
          </div>
          <div id="statusBox" class="status-message">
            <i class="fa-regular fa-compass"></i> انتظار البوصلة...
          </div>
          <div class="hint">
            <i class="fa-solid fa-mobile-screen-button"></i>
            ضع الهاتف مستوياً (أفقياً) لدقة أفضل
          </div>
        </div>
      </div>

    <script>
      (function () {
        const KAABA_LAT = 21.4225;
        const KAABA_LNG = 39.8262;

        let userLat = null,
          userLng = null;
        let absoluteQibla = null;
        let deviceHeading = 0;
        let compassReady = false;

        const locationBox = document.getElementById("locationBox");
        const qiblaUI = document.getElementById("qiblaUI");
        const qiblaDegreesSpan = document.getElementById("qiblaDegrees");
        const statusBox = document.getElementById("statusBox");
        const canvas = document.getElementById("qiblaCanvas");
        const ctx = canvas.getContext("2d");
        const loadingIndicator = document.getElementById("loadingIndicator");
        let animationId = null;

        function showLoader(show = true, message = "جار التحميل ...") {
          if (!loadingIndicator) return;
          if (show) {
            if (locationBox) locationBox.style.display = "none";
            if (qiblaUI) qiblaUI.classList.add("hidden");
            loadingIndicator.style.display = "block";
            const textSpan =
              loadingIndicator.querySelector(".loading-text span");
            const msgParagraph = loadingIndicator.querySelector("p");
            if (textSpan) textSpan.innerText = message;
            if (msgParagraph)
              msgParagraph.innerText = "يتم تجهيز البوصلة وتحديد الموقع";
          } else {
            loadingIndicator.style.display = "none";
          }
        }

        function hideLoaderAndShowContent(showQibla = false) {
          if (loadingIndicator) loadingIndicator.style.display = "none";
          if (showQibla && qiblaUI) {
            qiblaUI.classList.remove("hidden");
            if (locationBox) locationBox.style.display = "none";
          } else if (!showQibla && locationBox) {
            locationBox.style.display = "block";
            if (qiblaUI) qiblaUI.classList.add("hidden");
          }
        }

        function toRad(deg) {
          return (deg * Math.PI) / 180;
        }
        function toDeg(rad) {
          return (rad * 180) / Math.PI;
        }

        function computeQiblaAngle(lat, lng) {
          const lat1 = toRad(lat);
          const lon1 = toRad(lng);
          const lat2 = toRad(KAABA_LAT);
          const lon2 = toRad(KAABA_LNG);
          const dLon = lon2 - lon1;
          const y = Math.sin(dLon) * Math.cos(lat2);
          const x =
            Math.cos(lat1) * Math.sin(lat2) -
            Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
          let angle = toDeg(Math.atan2(y, x));
          return (angle + 360) % 360;
        }

        function drawCompass() {
          if (!ctx || absoluteQibla === null) return;

          const size = 280;
          const center = size / 2;
          const radius = size / 2 - 12;

          ctx.clearRect(0, 0, size, size);

          ctx.beginPath();
          ctx.arc(center, center, radius, 0, 2 * Math.PI);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
          ctx.strokeStyle = "#cfe9cf";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.save();
          ctx.translate(center, center);
          ctx.rotate(toRad(-deviceHeading));

          for (let deg = 0; deg < 360; deg += 30) {
            const rad = toRad(deg - 90);
            const inner = radius - 14;
            const outer = radius - 5;
            ctx.beginPath();
            ctx.moveTo(inner * Math.cos(rad), inner * Math.sin(rad));
            ctx.lineTo(outer * Math.cos(rad), outer * Math.sin(rad));
            ctx.strokeStyle = "#a0b8a0";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          const labels = [
            { a: 0, n: "N" },
            { a: 90, n: "E" },
            { a: 180, n: "S" },
            { a: 270, n: "W" },
          ];
          ctx.font = "bold 16px 'Tajawal'";
          ctx.fillStyle = "#3e613a";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          labels.forEach((l) => {
            const rad = toRad(l.a - 90);
            const x = (radius - 30) * Math.cos(rad);
            const y = (radius - 30) * Math.sin(rad);
            ctx.fillText(l.n, x, y);
          });

          const targetRad = toRad(absoluteQibla - 90);
          const arrowLength = radius - 40;
          const endX = arrowLength * Math.cos(targetRad);
          const endY = arrowLength * Math.sin(targetRad);

          let angleDiff = (absoluteQibla - deviceHeading + 360) % 360;
          let smallestDiff = Math.min(angleDiff, 360 - angleDiff);
          const isCorrect = smallestDiff < 8;
          const arrowColor = isCorrect ? "#2b8c4a" : "#d94f4f";

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(endX, endY);
          ctx.strokeStyle = arrowColor;
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.stroke();

          const headSize = 16;
          ctx.save();
          ctx.translate(endX, endY);
          ctx.rotate(targetRad + Math.PI / 2);
          ctx.beginPath();
          ctx.moveTo(0, -headSize);
          ctx.lineTo(-headSize / 1.5, headSize / 2);
          ctx.lineTo(headSize / 1.5, headSize / 2);
          ctx.closePath();
          ctx.fillStyle = arrowColor;
          ctx.fill();
          ctx.restore();

          ctx.restore();

          ctx.beginPath();
          ctx.arc(center, center, 18, 0, 2 * Math.PI);
          ctx.fillStyle = "#2c3e2c";
          ctx.fill();

          updateStatusMessage(angleDiff, smallestDiff);
        }

        function updateStatusMessage(rawDiff, smallestDiff) {
          if (!statusBox) return;
          if (!compassReady) {
            statusBox.innerHTML = `<i class="fa-regular fa-compass"></i> جاري معايرة البوصلة...`;
            statusBox.classList.remove("on-target");
            return;
          }
          if (smallestDiff < 8) {
            statusBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> القبلة أمامك مباشرة`;
            statusBox.classList.add("on-target");
          } else {
            const dirText = rawDiff < 180 ? "اليمين" : "اليسار";
            const dirIcon = rawDiff < 180 ? "fa-arrow-right" : "fa-arrow-left";
            statusBox.innerHTML = `<i class="fa-solid fa-arrows-spin"></i> أدر الهاتف نحو ${dirText} <i class="fa-solid ${dirIcon}"></i>`;
            statusBox.classList.remove("on-target");
          }
        }

        function initCompass() {
          if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
          ) {
            const btn = document.createElement("button");
            btn.innerHTML =
              '<i class="fa-solid fa-lock-open"></i> تفعيل البوصلة';
            btn.style.backgroundColor = "var(--primary-green)";
            btn.style.margin = "0 auto";
            btn.style.display = "inline-block";
            btn.onclick = () => {
              DeviceOrientationEvent.requestPermission()
                .then((p) => {
                  if (p === "granted") {
                    window.addEventListener(
                      "deviceorientation",
                      onOrientation,
                      true,
                    );
                    btn.remove();
                    statusBox.innerHTML = `<i class="fa-regular fa-compass"></i> البوصلة تعمل ...`;
                  }
                })
                .catch(() => {
                  statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> يرجى السماح بحساس الاتجاه`;
                });
            };
            statusBox.innerHTML = "";
            statusBox.appendChild(btn);
          } else {
            window.addEventListener("deviceorientation", onOrientation, true);
          }
        }

        function onOrientation(e) {
          let heading = null;
          if (e.webkitCompassHeading !== undefined) {
            heading = e.webkitCompassHeading;
          } else if (e.alpha !== null && e.alpha !== undefined) {
            heading = 360 - e.alpha;
          }
          if (heading !== null && heading !== undefined) {
            deviceHeading = heading;
            compassReady = true;
          }
        }

        function showOfflineMsg(msg) {
          const el = document.getElementById("offlineNotice");
          if (!el) return;
          el.innerHTML = `<i class="fa-solid fa-wifi-slash"></i> ${msg}`;
          el.style.display = "block";
          setTimeout(() => {
            el.style.display = "none";
          }, 5000);
        }

        function requestLocation() {
          if (!navigator.geolocation) {
            showOfflineMsg("المتصفح لا يدعم تحديد الموقع");
            return;
          }

          if (navigator.onLine === false) {
            showOfflineMsg("يتطلب تحديد الموقع اتصالاً بالإنترنت مؤقتاً");
            showLoader(false);
            return;
          }

          showLoader(true, "جار تحديد الموقع ...");

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              userLat = pos.coords.latitude;
              userLng = pos.coords.longitude;
              absoluteQibla = computeQiblaAngle(userLat, userLng);
              qiblaDegreesSpan.innerText = Math.round(absoluteQibla);

              showLoader(false);
              if (locationBox) locationBox.style.display = "none";
              qiblaUI.classList.remove("hidden");

              initCompass();

              function animate() {
                drawCompass();
                animationId = requestAnimationFrame(animate);
              }
              animate();
            },
            (err) => {
              console.error("Geolocation error", err);
              let errorMsg =
                "لم نتمكن من تحديد موقعك. تأكد من تفعيل خدمات الموقع.";
              if (err.code === 1)
                errorMsg = "الرجاء السماح بتحديد الموقع في المتصفح.";
              else if (err.code === 2)
                errorMsg = "تعذر تحديد الموقع، تأكد من الاتصال.";
              showOfflineMsg(errorMsg);
              showLoader(false);
              if (locationBox) locationBox.style.display = "block";
              qiblaUI.classList.add("hidden");
            },
            { enableHighAccuracy: true, timeout: 12000 },
          );
        }

        window.requestLocation = requestLocation;

        window.addEventListener("beforeunload", () => {
          if (animationId) cancelAnimationFrame(animationId);
        });
      })();

      // ===== Dark Mode =====
      (function () {
        var saved = localStorage.getItem("istiqamah-theme");
        if (
          saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
      function toggleTheme() {
        var html = document.documentElement;
        var btn = document.getElementById("themeToggle");
        var isDark = html.getAttribute("data-theme") === "dark";
        if (isDark) {
          html.removeAttribute("data-theme");
          localStorage.setItem("istiqamah-theme", "light");
          if (btn) btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
          html.setAttribute("data-theme", "dark");
          localStorage.setItem("istiqamah-theme", "dark");
          if (btn) btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
      }
      (function () {
        var btn = document.getElementById("themeToggle");
        if (btn) {
          var isDark =
            document.documentElement.getAttribute("data-theme") === "dark";
          btn.innerHTML = isDark
            ? '<i class="fa-solid fa-sun"></i>'
            : '<i class="fa-solid fa-moon"></i>';
        }
      })();

      function openMenu() {
        document.getElementById("links-menu").style.left = "0";
        document.getElementById("overlay").style.display = "block";
      }

      function closeMenu() {
        document.getElementById("links-menu").style.left = "-100%";
        document.getElementById("overlay").style.display = "none";
      }

      window.openMenu = openMenu;
      window.closeMenu = closeMenu;
    </script>

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
    </script>
