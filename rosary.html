<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تطبيق استقامة - تسبيح</title>
    <meta name="theme-color" content="#1B7A4B" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap");

      * { user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      input { user-select: text; }

      .container { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 100px); }

      .tasbeeh-card {
        width: 100%; max-width: 370px;
        background: var(--bg-card);
        border-radius: var(--radius-xl);
        padding: 20px 24px 28px;
        box-shadow: var(--glass-shadow);
        border: 1px solid var(--glass-border);
        text-align: center;
        transition: background .4s, border-color .4s, box-shadow .4s;
        backdrop-filter: blur(10px);
        position: relative;
      }
      @media(max-width:420px){ .tasbeeh-card { padding: 14px 16px 22px; border-radius: var(--radius-lg); } }

      .card-top {
        display: flex; justify-content: flex-end; align-items: center;
        margin-bottom: 6px; height: 32px;
      }
      .sound-btn {
        background: none; border: none; cursor: pointer;
        width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        color: var(--text-muted);
        font-size: 15px;
        transition: background .25s, color .25s;
      }
      .sound-btn:hover { background: var(--primary-soft); color: var(--text-primary); }
      .sound-btn:active { transform: scale(.88); }
      .sound-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

      .tasbeeh-heading {
        font-family: "Amiri", serif;
        font-size: 28px; font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 18px;
      }
      @media(max-width:420px){ .tasbeeh-heading { font-size: 24px; margin-bottom: 14px; } }

      .bead-wrap {
        position: relative;
        width: 184px; height: 184px;
        margin: 0 auto 16px;
      }
      .bead-wrap svg {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        transform: rotate(-90deg);
      }
      .ring-bg {
        fill: none; stroke: var(--border-medium); stroke-width: 5; stroke-linecap: round;
        transition: stroke .4s;
      }
      .ring-fill {
        fill: none; stroke: #3B8C5E; stroke-width: 5; stroke-linecap: round;
        stroke-dasharray: 502.65;
        stroke-dashoffset: 502.65;
        transition: stroke-dashoffset .5s, stroke .4s;
      }
      .bead {
        position: absolute; top: 50%; left: 50%;
        width: 146px; height: 146px;
        transform: translate(-50%,-50%);
        border-radius: 50%;
        background: radial-gradient(circle at 34% 26%, #6BAF8D, #3B8C5E 50%, #1F5C3D 100%);
        box-shadow: inset 0 -6px 16px rgba(0,0,0,.3), inset 0 6px 16px rgba(255,255,255,.12), 0 8px 32px rgba(59,140,94,.2);
        display: flex; align-items: center; justify-content: center;
        transition: box-shadow .6s, background .4s;
      }
      .bead::before {
        content: ''; position: absolute;
        top: 9%; left: 17%;
        width: 42%; height: 26%;
        background: radial-gradient(ellipse, rgba(255,255,255,.28) 0%, transparent 100%);
        border-radius: 50%; pointer-events: none;
      }
      .bead.goal-reached {
        box-shadow: inset 0 -6px 16px rgba(0,0,0,.3), inset 0 6px 16px rgba(255,255,255,.12), 0 0 40px rgba(59,140,94,.25), 0 8px 32px rgba(59,140,94,.2);
      }
      [data-theme="dark"] .bead {
        background: radial-gradient(circle at 34% 26%, #4A7C5E, #2D5C40 50%, #1A3D28 100%);
        box-shadow: inset 0 -6px 16px rgba(0,0,0,.5), inset 0 6px 16px rgba(255,255,255,.06), 0 8px 32px rgba(45,92,64,.3);
      }
      [data-theme="dark"] .bead::before {
        background: radial-gradient(ellipse, rgba(255,255,255,.15) 0%, transparent 100%);
      }
      [data-theme="dark"] .bead.goal-reached {
        box-shadow: inset 0 -6px 16px rgba(0,0,0,.5), inset 0 6px 16px rgba(255,255,255,.06), 0 0 50px rgba(45,92,64,.35), 0 8px 32px rgba(45,92,64,.3);
      }
      .bead-count {
        font-family: "Amiri", serif;
        font-size: 60px; font-weight: 700;
        color: #f0f0f0; line-height: 1;
        text-shadow: 0 2px 8px rgba(0,0,0,.3);
        transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      }
      .bead-count.pop { transform: scale(1.12); }
      [data-theme="dark"] .bead-count { color: #d4d4d4; }

      .divider {
        width: 40px; height: 1px;
        background: var(--border-medium);
        margin: 0 auto 18px; transition: background .4s;
      }

      .action-btn {
        display: block;
        width: 112px; height: 112px;
        border-radius: 50%;
        border: none; cursor: pointer;
        background: radial-gradient(circle at 36% 28%, #6BAF8D, #3B8C5E 55%, #1F5C3D 100%);
        box-shadow: inset 0 -4px 12px rgba(0,0,0,.2), inset 0 4px 12px rgba(255,255,255,.1), 0 4px 20px rgba(59,140,94,.2);
        font-family: "Tajawal", sans-serif;
        font-size: 17px; font-weight: 600;
        color: #f0f0f0;
        margin: 0 auto 2px;
        transition: transform .2s, box-shadow .3s;
        position: relative;
      }
      .action-btn::before {
        content: ''; position: absolute;
        top: 9%; left: 20%;
        width: 38%; height: 22%;
        background: radial-gradient(ellipse, rgba(255,255,255,.18), transparent);
        border-radius: 50%; pointer-events: none;
      }
      .action-btn:hover { box-shadow: 0 6px 28px rgba(59,140,94,.3); }
      .action-btn:active { transform: scale(.9); }
      .action-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
      [data-theme="dark"] .action-btn {
        background: radial-gradient(circle at 36% 28%, #4A7C5E, #2D5C40 55%, #1A3D28 100%);
        box-shadow: inset 0 -4px 12px rgba(0,0,0,.4), inset 0 4px 12px rgba(255,255,255,.05), 0 4px 20px rgba(45,92,64,.25);
        color: #d4d4d4;
      }

      .reset-link {
        background: none; border: none; cursor: pointer;
        font-family: "Tajawal", sans-serif;
        font-size: 12px; font-weight: 400;
        color: var(--text-muted);
        display: inline-block;
        padding: 4px 12px;
        border-radius: var(--radius-sm);
        transition: color .2s, background .2s;
        margin-bottom: 16px;
      }
      .reset-link:hover { color: var(--text-primary); background: var(--primary-soft); }
      .reset-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

      .goal-row {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin-bottom: 16px;
      }
      .goal-label {
        font-family: "Tajawal", sans-serif;
        font-size: 13px; font-weight: 400;
        color: var(--text-muted); letter-spacing: .3px;
      }
      .goal-input {
        width: 60px;
        font-family: "Amiri", serif;
        font-size: 18px; font-weight: 700;
        text-align: center;
        padding: 4px 0;
        border: none; border-bottom: 2px solid var(--border-medium);
        background: transparent;
        color: var(--text-primary);
        transition: border-color .25s, color .4s;
        direction: ltr;
      }
      .goal-input:focus { outline: none; border-color: var(--primary); }

      .stats {
        display: flex; align-items: center; justify-content: center; gap: 3px;
        font-family: "Tajawal", sans-serif;
        font-size: 11px; font-weight: 300;
        color: var(--text-muted);
      }
      .stats-val { font-weight: 500; }
      .stats-dot { color: var(--border-medium); padding: 0 2px; }

      .overlay {
        display: none;
        position: absolute; inset: 0;
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: var(--radius-xl);
        z-index: 10;
        flex-direction: column; align-items: center; justify-content: center;
        padding: 24px;
        animation: overlayIn .4s ease forwards;
      }
      .overlay.show { display: flex; }
      .overlay-title {
        font-family: "Amiri", serif;
        font-size: 34px; font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .overlay-sub {
        font-family: "Tajawal", sans-serif;
        font-size: 14px; font-weight: 400;
        color: var(--text-muted);
        margin-bottom: 20px;
      }
      .overlay-dismiss {
        font-family: "Tajawal", sans-serif;
        font-size: 12px; font-weight: 500;
        color: var(--text-secondary);
        background: none; border: 1px solid var(--border-medium);
        padding: 8px 28px; border-radius: var(--radius-md);
        cursor: pointer;
        transition: background .25s, border-color .25s, color .25s;
      }
      .overlay-dismiss:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
      .overlay-dismiss:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

      @keyframes overlayIn {
        from { opacity: 0; transform: scale(.9); }
        to { opacity: 1; transform: scale(1); }
      }

      [data-theme="dark"] .ring-bg { stroke: rgba(255,255,255,0.08); }
      [data-theme="dark"] .ring-fill { stroke: #22C55E; }
      [data-theme="dark"] .goal-input { color: var(--text-primary); }
      [data-theme="dark"] .overlay { background: var(--bg-card); }
      [data-theme="dark"] .overlay-dismiss { border-color: rgba(255,255,255,0.1); }

      .section-title { padding: 12px 0; }
      .section-title h2 {
        font-size: 20px; font-weight: 700;
        color: var(--text-primary);
      }

      @media(max-width:420px){
        .bead-wrap { width: 160px; height: 160px; }
        .bead { width: 126px; height: 126px; }
        .bead-count { font-size: 50px; }
        .action-btn { width: 96px; height: 96px; font-size: 15px; }
        .reset-link { margin-bottom: 12px; }
        .divider { margin-bottom: 14px; }
      }
      @media(max-width:360px){
        .tasbeeh-card { padding: 14px 12px 18px; }
        .bead-wrap { width: 136px; height: 136px; }
        .bead { width: 108px; height: 108px; }
        .bead-count { font-size: 40px; }
        .action-btn { width: 84px; height: 84px; font-size: 14px; }
        .goal-input { width: 52px; font-size: 16px; }
      }
      @media(min-width:600px){
        .tasbeeh-card { max-width: 400px; padding: 32px 32px 36px; border-radius: 36px; }
        .bead-wrap { width: 200px; height: 200px; }
        .bead { width: 158px; height: 158px; }
        .bead-count { font-size: 66px; }
        .action-btn { width: 124px; height: 124px; font-size: 19px; }
        .tasbeeh-heading { font-size: 30px; }
      }

      @media(prefers-reduced-motion:reduce){
        *,.bead,.ring-fill,.bead-count,.overlay,.tasbeeh-card,.action-btn{animation:none!important;transition:none!important}
      }

      #links-menu a[href="rosary.html"] {
        background: var(--primary-soft);
        color: var(--primary-green);
        border-color: var(--border-medium);
      }
      #links-menu a[href="rosary.html"] .link-circle {
        background: var(--primary);
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="overlay" onclick="closeMenu()"></div>

    <div id="links-menu">
      <div class="menu-header-area">
        <div class="menu-logo"><i class="fa-solid fa-mosque"></i></div>
        <span class="menu-title">استقامة</span>
        <button class="menu-close-btn" onclick="closeMenu()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <a href="index.html" class="link-item" onclick="closeMenu()">
        <div class="link-circle"><i class="fa-solid fa-house"></i></div>
        الرئيسية
      </a>
      <a href="azkar.html" class="link-item" onclick="closeMenu()">
        <div class="link-circle"><i class="fa-solid fa-hands-praying"></i></div>
        الأذكار
      </a>
      <a href="quran.html" class="link-item" onclick="closeMenu()">
        <div class="link-circle"><i class="fa-solid fa-book-open"></i></div>
        القرآن
      </a>
      <a href="prayertime.html" class="link-item" onclick="closeMenu()">
        <div class="link-circle"><i class="fa-solid fa-mosque"></i></div>
        أوقات الصلاة
      </a>
      <a href="rosary.html" class="link-item" onclick="closeMenu()">
        <div class="link-circle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="currentColor"><circle cx="12" cy="3.9" r="1.1"/><circle cx="14.35" cy="4.75" r="1.1"/><circle cx="16" cy="6.6" r="1.1"/><circle cx="16.65" cy="9" r="1.1"/><circle cx="15.45" cy="11.55" r="1.1"/><circle cx="13.65" cy="13.4" r="1.1"/><circle cx="10.35" cy="13.4" r="1.1"/><circle cx="8.55" cy="11.55" r="1.1"/><circle cx="7.35" cy="9" r="1.1"/><circle cx="8" cy="6.6" r="1.1"/><circle cx="9.65" cy="4.75" r="1.1"/><rect x="10.85" y="13.9" width="2.3" height="1.5" rx="0.6"/></g><g stroke="currentColor" stroke-width="1.15" stroke-linecap="round"><path d="M11.1 15.4V19.7"/><path d="M12.25 15.4V20.7"/><path d="M13.4 15.4V19.7"/></g></svg></div>
        التسبيح
      </a>
      <a href="qipla-direction.html" class="link-item" onclick="closeMenu()">
        <div class="link-circle"><i class="fa-solid fa-location-arrow"></i></div>
        اتجاه القبلة
      </a>
      <a href="about.html" class="link-item" onclick="closeMenu()">
        <div class="link-circle"><i class="fa-solid fa-circle-info"></i></div>
        حول التطبيق
      </a>
    </div>

    <header class="main-header">
      <div class="logo-area">
        <div class="logo-icon-wrapper">
          <i class="fa-solid fa-mosque"></i>
        </div>
        <h1>استقامة</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="الوضع الليلي / النهاري">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button class="header-btn" onclick="toggleMenu()">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </header>

    <div class="container">
      <div class="tasbeeh-card">
        <div class="card-top">
          <button class="sound-btn" id="sound-btn" title="كتم الصوت">
            <i class="fa-solid fa-volume-high"></i>
          </button>
        </div>
        <h1 class="tasbeeh-heading">سَبِّح</h1>

        <div class="bead-wrap">
          <svg viewBox="0 0 184 184" aria-hidden="true">
            <circle class="ring-bg" cx="92" cy="92" r="80" />
            <circle class="ring-fill" id="ring-fill" cx="92" cy="92" r="80" />
          </svg>
          <div class="bead" id="bead">
            <span class="bead-count" id="count-display">٠</span>
          </div>
        </div>

        <button class="action-btn" id="tasbeeh-btn">سبّح</button>
        <button class="reset-link" id="reset-btn">إعادة</button>

        <div class="divider"></div>

        <div class="goal-row">
          <span class="goal-label">الهدف</span>
          <input class="goal-input" id="goal-input" type="number" value="33" min="1" max="999" />
        </div>

        <div class="stats">
          <span>اليوم</span>
          <span class="stats-val" id="today-count">٠</span>
          <span class="stats-dot">·</span>
          <span>الأسبوع</span>
          <span class="stats-val" id="week-count">٠</span>
        </div>

        <div class="overlay" id="congrats-overlay">
          <div class="overlay-title">سُبْحَانَ الله</div>
          <div class="overlay-sub">أكملت التسبيح</div>
          <button class="overlay-dismiss" id="dismiss-btn">حسناً</button>
        </div>
      </div>
    </div>

    <script>
      (function(){
        var C = document.getElementById('count-display');
        var B = document.getElementById('bead');
        var T = document.getElementById('tasbeeh-btn');
        var R = document.getElementById('reset-btn');
        var G = document.getElementById('goal-input');
        var F = document.getElementById('ring-fill');
        var D = document.getElementById('today-count');
        var W = document.getElementById('week-count');
        var O = document.getElementById('congrats-overlay');
        var X = document.getElementById('dismiss-btn');

        var M = document.getElementById('sound-btn');
        var count = 0, goal = 33, muted = false;
        var circ = 502.65;

        function ar(n){ return n.toLocaleString('ar-SA'); }

        function uRing(){
          F.style.strokeDashoffset = circ - (circ * Math.min(count/goal, 1));
        }
        function uDisp(){
          C.textContent = ar(count);
          uRing();
          B.classList.toggle('goal-reached', count >= goal);
        }
        function popIt(){
          C.classList.remove('pop');
          void C.offsetWidth;
          C.classList.add('pop');
          setTimeout(function(){ C.classList.remove('pop'); }, 400);
        }
        function click(){
          if(muted) return;
          try{
            var ac = new (window.AudioContext || window.webkitAudioContext)();
            var t = ac.currentTime, sr = ac.sampleRate;
            var len = Math.floor(sr * 0.035);
            var buf = ac.createBuffer(1, len, sr);
            var d = buf.getChannelData(0);
            for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(len*0.12));
            var src = ac.createBufferSource();
            src.buffer = buf;
            var f = ac.createBiquadFilter();
            f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 1.2;
            var g = ac.createGain();
            g.gain.setValueAtTime(0.18, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
            src.connect(f); f.connect(g); g.connect(ac.destination);
            src.start(t); src.stop(t + 0.05);
          }catch(e){}
        }
        function vib(){ if(navigator.vibrate) navigator.vibrate(6); }

        function saveDay(){
          var k = new Date().toISOString().split('T')[0];
          var n = (parseInt(localStorage.getItem('z_'+k))||0)+1;
          localStorage.setItem('z_'+k, n);
          D.textContent = ar(n);
          weekUp();
        }
        function weekUp(){
          var s = 0, td = new Date();
          for(var i=0;i<7;i++){
            var d = new Date(td); d.setDate(d.getDate()-i);
            s += parseInt(localStorage.getItem('z_'+d.toISOString().split('T')[0]))||0;
          }
          W.textContent = ar(s);
        }
        function loadDay(){
          var k = new Date().toISOString().split('T')[0];
          D.textContent = ar(parseInt(localStorage.getItem('z_'+k))||0);
          weekUp();
        }

        T.onclick = function(){
          if(count < goal){
            count++; uDisp(); popIt(); click(); vib(); saveDay();
            if(count === goal){
              G.value = ''; G.placeholder = ar(goal)+' — ضع هدفاً جديداً';
              O.classList.add('show');
            }
          }
        };
        R.onclick = function(){ count=0; uDisp(); O.classList.remove('show'); };
        G.onchange = function(){
          var v = parseInt(G.value);
          goal = (v && v>0) ? v : 33;
          count=0; G.placeholder = 'الهدف'; uDisp(); O.classList.remove('show');
        };
        X.onclick = function(){ O.classList.remove('show'); };
        M.onclick = function(){
          muted = !muted;
          M.innerHTML = muted
            ? '<i class="fa-solid fa-volume-xmark"></i>'
            : '<i class="fa-solid fa-volume-high"></i>';
        };

        G.value = goal; uDisp(); loadDay();
      })();

      // ---- الوضع الليلي ----
      (function () {
        var saved = localStorage.getItem("istiqamah-theme");
        if (saved === "dark" || (saved === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
      function toggleTheme() {
        var html = document.documentElement;
        var btn = document.getElementById("themeToggle");
        var isDark = html.getAttribute("data-theme") === "dark";
        if (isDark) {
          html.removeAttribute("data-theme");
          localStorage.setItem("istiqamah-theme", "light");
          if (btn) btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
          html.setAttribute("data-theme", "dark");
          localStorage.setItem("istiqamah-theme", "dark");
          if (btn) btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
      }
      (function () {
        var btn = document.getElementById("themeToggle");
        if (btn) {
          var isDark = document.documentElement.getAttribute("data-theme") === "dark";
          btn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }
      })();

      // قائمة جانبية
      function toggleMenu() {
        const menu = document.getElementById("links-menu");
        const overlay = document.getElementById("overlay");
        if (menu.style.left === "0px") {
          menu.style.left = "-100%";
          overlay.style.display = "none";
        } else {
          menu.style.left = "0px";
          overlay.style.display = "block";
        }
      }
      function closeMenu() {
        const menu = document.getElementById("links-menu");
        const overlay = document.getElementById("overlay");
        menu.style.left = "-100%";
        overlay.style.display = "none";
      }
    </script>
    <script>
      if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
    </script>
  </body>
</html>
